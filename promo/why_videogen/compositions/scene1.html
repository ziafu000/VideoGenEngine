        .cost-drain-tag {
          font-size: 19px;
          font-weight: 600;

          padding: 8px 24px;
          border-radius: 9999px;
          border: 1px solid rgba(239, 68, 68, 0.35);
        }
      </style>

      <div id="root" data-composition-id="scene1" data-width="1920" data-height="1080">
        <div id="s1-header" class="scene-header">
          <div class="badge-danger">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            The Expensive AI Trap
          </div>
          <h1 class="scene-title">AI Video Creation <span class="highlight-red">Shouldn't Drain</span> Your Wallet</h1>
          <p class="scene-subtitle">Fragile workflows, restrictive rate limits, and runaway monthly credit bills.</p>

          <div class="s1-modals-col">
            <div id="s1-card1" class="alert-card">
              <div class="alert-icon-box">
                <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"></circle>
                  <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
              </div>
              <div class="alert-content">
                <h4>Claude Rate Limit Reached</h4>
                <p>5-hour usage limit reached. Your video storyboard generation is paused until 4:12 PM.</p>
              </div>
            </div>

            <div id="s1-card2" class="alert-card">
              <div class="alert-icon-box">
                <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="7" width="16" height="10" rx="2" ry="2"></rect>
                  <line x1="22" y1="11" x2="22" y2="13"></line>
                  <line x1="6" y1="10" x2="6" y2="14" stroke="#ef4444" stroke-width="3"></line>
                </svg>
              </div>
              <div class="alert-content">
                <h4>Higgsfield Credits Depleted</h4>
                <p>Balance: 0 / 1,000 video credits. Top up $50 to generate 3 more 5-second video clips.</p>
              </div>
            </div>
          </div>

          <div id="s1-cost-card" class="s1-cost-col">
            <div id="wallet-icon" class="wallet-visual">
              <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"></path>
                <path d="M3 5v14a2 2 0 0 0 2 2h16v-5"></path>
                <path d="M18 12a2 2 0 0 0 0 4h4v-4Z"></path>
                <circle cx="18" cy="14" r="1" fill="#ef4444"></circle>
              </svg>
            </div>
            <div class="cost-label">Monthly Creator Drain</div>
            <div id="cost-ticker" class="cost-ticker">$0</div>
            <div class="cost-drain-tag">Per Month • Manual Clicking • 720p Limits</div>
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        tl.fromTo("#s1-header", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 0.1);
        tl.fromTo("#s1-card1", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 0.8);
        tl.fromTo("#s1-card2", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 2.0);
        tl.fromTo("#s1-cost-card", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.5)" }, 2.8);
        tl.fromTo("#wallet-icon", { y: -15, rotation: -8 }, { y: 15, rotation: 8, repeat: 4, yoyo: true, duration: 0.6, ease: "sine.inOut" }, 3.0);

        const tickerObj = { val: 0 };
        tl.to(tickerObj, {
          val: 150,
          duration: 1.8,
          ease: "power2.inOut",
          onUpdate: () => {
            const el = document.getElementById("cost-ticker");
            if (el) el.textContent = "$" + Math.round(tickerObj.val) + "+";
          }
        }, 3.4);

        tl.to("#root", { opacity: 0, y: -20, duration: 0.5, ease: "power2.in" }, 8.9);

        window.__timelines["scene1"] = tl;
        tl.seek(0);
      </script>
